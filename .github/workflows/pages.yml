name: Pages
on:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install wasm target
        run: rustup target add wasm32-unknown-unknown
      - name: Install wasm-pack
        run: cargo install wasm-pack
      - name: Build webcore to wasm
        run: |
          wasm-pack build crates/webcore --target web \
            --out-dir ../../web/wasm/pkg
      - name: Verify site assets
        run: ls -la web web/wasm/pkg
      - name: Playwright e2e against built wasm (bun)
        run: |
          curl -fsSL https://bun.sh/install | bash
          export PATH=$HOME/.bun/bin:$PATH
          bunx serve -l 8899 web &
          sleep 2
          cd web/e2e
          bun install --no-audit --no-fund
          bunx playwright install --with-deps chromium
          PLAYWRIGHT_BASE_URL=http://localhost:8899 bunx playwright test
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - uses: actions/deploy-pages@v4
        id: deployment
